name: Regenerate Prototype pnpm lockfile

on:
  push:
    branches:
      - Prototype
    paths:
      - ".github/workflows/prototype-regenerate-lock.yml"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Prototype
        uses: actions/checkout@v4
        with:
          ref: Prototype

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches package manifests."
            exit 0
          fi
          git commit -m "chore(web): sync pnpm lockfile with production dependency pins"
          git push origin HEAD:Prototype
