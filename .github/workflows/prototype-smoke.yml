name: Prototype dev smoke test

on:
  push:
    branches:
      - Prototype
  pull_request:
    branches:
      - staging
  workflow_dispatch:

jobs:
  dev-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Prototype branch
        uses: actions/checkout@v4
        with:
          ref: Prototype

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@11.25.0 --activate

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start dev servers
        run: |
          pnpm dev > /tmp/accfikole-dev.log 2>&1 &
          echo $! > /tmp/accfikole-dev.pid

      - name: Verify web app on port 3000
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/web.html; then
              echo "Web app is responding on port 3000"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/accfikole-dev.log
          exit 1

      - name: Verify docs app on port 3001
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ > /tmp/docs.html; then
              echo "Docs app is responding on port 3001"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/accfikole-dev.log
          exit 1

      - name: Show dev log
        if: always()
        run: cat /tmp/accfikole-dev.log || true
